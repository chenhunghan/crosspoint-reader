; Agent Mux fork: Metalio E-Ink 4 build with the Agent Mux app compiled in.
; All app code lives in src/agentmux/ behind #if AGENTMUX.
;   pio run -e metalio_eink4_agentmux
[env:metalio_eink4_agentmux]
extends = env:metalio_eink4
build_flags =
  ${env:metalio_eink4.build_flags}
  -DAGENTMUX=1
; The mahler screen, built from ../ui-ffi (esp32-agent-mux) and linked by this script.
extra_scripts =
  ${base.extra_scripts}
  pre:src/agentmux/build_mahler_ui.py

; Dev build: as above, and opens Agent Mux by itself a few seconds after boot,
; for testing on hardware with nobody at the device. Not for daily use.
[env:metalio_eink4_agentmux_dev]
extends = env:metalio_eink4_agentmux
build_flags =
  ${env:metalio_eink4_agentmux.build_flags}
  -DAGENTMUX_AUTOSTART=1
